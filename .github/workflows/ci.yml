name: Papu English CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
  android:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - run: npm install
      - run: npx expo prebuild --platform android --no-install
      - run: cd android && ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease --no-daemon
      - run: test -f android/app/build/outputs/apk/debug/app-debug.apk
      - run: test -f android/app/build/outputs/apk/release/app-release.apk
      - run: test -f android/app/build/outputs/bundle/release/app-release.aab
      - name: Verify ARM64 support
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/'
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'lib/arm64-v8a/'
      - name: Verify release JavaScript bundle
        run: |
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'assets/index.android.bundle'
      - name: Upload release APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: papu-english-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: papu-english-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
