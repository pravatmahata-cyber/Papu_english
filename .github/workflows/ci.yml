name: Papu English CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
  android:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - run: npm install
      - run: npx expo prebuild --platform android --no-install
      - run: cd android && ./gradlew :app:assembleDebug --no-daemon
      - run: test -f android/app/build/outputs/apk/debug/app-debug.apk
      - run: unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/'
      - uses: actions/upload-artifact@v4
        with:
          name: papu-english-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
